name: Deploy NimTech Bamboo to Beget

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beget-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout approved site
        uses: actions/checkout@v4

      - name: Verify required files
        run: |
          test -f index.html
          test -f robots.txt
          test -f sitemap.xml
          test -f showroom-original.html
          test -d assets

      - name: Install LFTP
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy over explicit FTPS
        env:
          FTP_SERVER: ${{ secrets.BEGET_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.BEGET_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.BEGET_FTP_PASSWORD }}
          FTP_DIRECTORY: ${{ secrets.BEGET_FTP_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" <<LFTP
          set cmd:fail-exit yes
          set ftp:ssl-allow yes
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ftp:passive-mode yes
          set ssl:verify-certificate yes
          set net:max-retries 5
          set net:reconnect-interval-base 5
          set net:timeout 45
          set ftp:ssl-protect-list yes
          mirror --reverse --verbose --continue --no-perms --only-newer --exclude-glob .git/ --exclude-glob .github/ --exclude-glob README.md --exclude-glob .nojekyll ./ "$FTP_DIRECTORY"
          bye
          LFTP
