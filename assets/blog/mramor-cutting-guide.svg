<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#f5f2ee"/><style>text{font-family:Arial,sans-serif;fill:#263744}.h{font-size:38px;font-weight:bold}.t{font-size:27px;font-weight:bold}.s{font-size:19px}.card{fill:white;stroke:#e0d8cf;stroke-width:2}.stone{fill:#e5d8c8;stroke:#8c7969;stroke-width:3}</style><text x="65" y="80" class="h">Раскрой гибкого мрамора: 3 шага</text><rect x="55" y="140" width="345" height="400" rx="20" class="card"/><text x="80" y="190" class="t">1. Разметка</text><rect x="95" y="230" width="265" height="220" class="stone"/><path d="M95 305H360" stroke="#c73b87" stroke-width="5" stroke-dasharray="12 9"/><text x="80" y="492" class="s">Отметьте линию реза</text><rect x="425" y="140" width="345" height="400" rx="20" class="card"/><text x="450" y="190" class="t">2. Надрез</text><rect x="465" y="230" width="265" height="220" class="stone"/><path d="M465 305H730" stroke="#c73b87" stroke-width="7"/><path d="M450 292H740" stroke="#4a5058" stroke-width="10"/><text x="450" y="492" class="s">Нож вдоль направляющей</text><rect x="795" y="140" width="345" height="400" rx="20" class="card"/><text x="820" y="190" class="t">3. Надлом</text><path d="M845 235H1100V310H845Z" class="stone"/><path d="M845 325L1100 385V460L845 400Z" class="stone"/><path d="M845 316H1100" stroke="#c73b87" stroke-width="4" stroke-dasharray="10 7"/><text x="820" y="492" class="s">По линии надреза</text><text x="65" y="595" font-size="21">Схема иллюстративная. Проверьте метод на обрезке конкретной панели.</text></svg>