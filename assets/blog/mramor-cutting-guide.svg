<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#f5f2ee"/><text x="70" y="80" font-family="Arial" font-size="37" font-weight="bold" fill="#192833">Раскрой листа: разметка → надрез → надлом</text><g font-family="Arial" font-size="25" fill="#263744"><rect x="60" y="150" width="325" height="370" rx="18" fill="#fff" stroke="#e0d8cf"/><rect x="105" y="220" width="235" height="235" fill="#e5d8c8" stroke="#8c7969" stroke-width="3"/><path d="M105 290H340" stroke="#bd467d" stroke-width="5" stroke-dasharray="12 9"/><text x="85" y="190" font-weight="bold">1. Разметка</text><text x="105" y="490" font-size="20">Линия по лицевой стороне</text><rect x="438" y="150" width="325" height="370" rx="18" fill="#fff" stroke="#e0d8cf"/><rect x="490" y="220" width="230" height="235" fill="#e5d8c8" stroke="#8c7969" stroke-width="3"/><path d="M490 290H720" stroke="#b83f77" stroke-width="8"/><path d="M470 282H740" stroke="#39444e" stroke-width="9"/><text x="462" y="190" font-weight="bold">2. Надрез</text><text x="465" y="490" font-size="20">Нож вдоль направляющей</text><rect x="816" y="150" width="325" height="370" rx="18" fill="#fff" stroke="#e0d8cf"/><path d="M865 230H1080V290H865Z" fill="#e5d8c8" stroke="#8c7969" stroke-width="3"/><path d="M865 300L1080 360V430L865 370Z" fill="#e5d8c8" stroke="#8c7969" stroke-width="3"/><path d="M865 295H1080" stroke="#b83f77" stroke-width="4" stroke-dasharray="9 6"/><text x="842" y="190" font-weight="bold">3. Надлом</text><text x="840" y="490" font-size="20">По линии надреза</text></g><text x="70" y="585" font-family="Arial" font-size="23" fill="#58656c">Схема иллюстративная. Перед раскроем проверьте способ на обрезке.</text></svg>