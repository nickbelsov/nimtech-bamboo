<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#242a27;background:#f7f7f4}
*{box-sizing:border-box}body{margin:0}header{background:#19231e;color:#fff;padding:25px max(24px,5vw);display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}

.card:hover{transform:translateY(-3px);box-shadow:0 12px 30px #18211b13}
.cover{aspect-ratio:4/3;background:#e8e9e5;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.card:hover .cover img{transform:scale(1.04)}
.info{padding:18px 19px 20px}.eyebrow{color:#98815e;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.sku{font-size:19px;font-weight:650;min-height:49px;margin-top:6px;line-height:1.25}
.price{font-size:18px;margin-top:12px}.hint{font-size:12px;color:#868d87;margin-top:10px}
dialog{padding:0;border:0;border-radius:14px;width:min(1000px,94vw);max-width:1000px;max-height:92vh;box-shadow:0 30px 90px #0007}
dialog::backdrop{background:#0b100bc9}
.modalhead{display:flex;justify-content:space-between;align-items:center;padding:20px 25px;gap:16px}
.modalhead h2{font-size:22px;margin:0}.close{border:0;background:#19231e;color:white;padding:10px 16px;border-radius:6px;cursor:pointer}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px 12px}
.gallery img{width:100%;height:auto;aspect-ratio:4/3;object-fit:contain;background:#eeefeb;border-radius:5px}
.modalfoot{padding:0 25px 24px;color:#777;font-size:14px}

<header><a href="index.html"><b>NIMTECH</b></a><small>BAMBOO · КАТАЛОГ ДЕКОРОВ</small><a href="index.html">← На главную</a></header>
<main><h1>Коллекция декоров</h1><p class="lead">19 декоров с установленными артикулами. Откройте карточку, чтобы рассмотреть фактуру на двух фотографиях. Дополнительные декоры появятся после подтверждения маркировки.</p>
<div class="tools"><input id="search" type="search" placeholder="Поиск по артикулу" aria-label="Поиск по артикулу">
<select id="sort" aria-label="Сортировка"><option value="default">По порядку</option><option value="price">По возрастанию цены</option><option value="name">По названию</option></select><span id="count"></span></div>
<section id="grid" class="grid"></section></main>
<dialog id="modal"><div class="modalhead"><h2 id="modal-title"></h2><button class="close" id="close">Закрыть ✕</button></div><div id="gallery" class="gallery"></div><div id="modal-price" class="modalfoot"></div></dialog>
<script>
const decors=[{"sku":"KFX921-2","name":"KFX921-2","price":13900,"main":"assets/decors/kfx921-2-main.webp","detail":"assets/decors/kfx921-2-detail.webp"},{"sku":"K7189-A237","name":"K7189-A237","price":13900,"main":"assets/decors/k7189-a237-main.webp","detail":"assets/decors/k7189-a237-detail.webp"},{"sku":"52007","name":"52007 · Бронзовый металлик","price":17400,"main":"assets/decors/52007-main.webp","detail":"assets/decors/52007-detail.webp"},{"sku":"Q-D9860-A235","name":"Q-D9860-A235","price":13900,"main":"assets/decors/q-d9860-a235-main.webp","detail":"assets/decors/q-d9860-a235-detail.webp"},{"sku":"741-A235","name":"741-A235","price":13900,"main":"assets/decors/741-a235-main.webp","detail":"assets/decors/741-a235-detail.webp"},{"sku":"FG6007-2","name":"FG6007-2","price":13900,"main":"assets/decors/fg6007-2-main.webp","detail":"assets/decors/fg6007-2-detail.webp"},{"sku":"QB2012","name":"QB2012","price":17400,"main":"assets/decors/qb2012-main.webp","detail":"assets/decors/qb2012-detail.webp"},{"sku":"QB2008","name":"QB2008","price":17400,"main":"assets/decors/qb2008-main.webp","detail":"assets/decors/qb2008-detail.webp"},{"sku":"QB2025","name":"QB2025","price":17400,"main":"assets/decors/qb2025-main.webp","detail":"assets/decors/qb2025-detail.webp"},{"sku":"Q-SX015-2","name":"Q-SX015-2","price":13900,"main":"assets/decors/q-sx015-2-main.webp","detail":"assets/decors/q-sx015-2-detail.webp"},{"sku":"Ripple-Silver","name":"Ripple Silver · Водная рябь, серебро","price":17400,"main":"assets/decors/ripple-silver-main.webp","detail":"assets/decors/ripple-silver-detail.webp"},{"sku":"RK-M010","name":"RK-M010","price":13900,"main":"assets/decors/rk-m010-main.webp","detail":"assets/decors/rk-m010-detail.webp"},{"sku":"RK-M027","name":"RK-M027 · Дуб морёный","price":13900,"main":"assets/decors/rk-m027-main.webp","detail":"assets/decors/rk-m027-detail.webp"},{"sku":"P6-JX1006J","name":"P6 (JX1006J)","price":13900,"main":"assets/decors/p6-jx1006j-main.webp","detail":"assets/decors/p6-jx1006j-detail.webp"},{"sku":"KFX921-1","name":"KFX921-1","price":13900,"main":"assets/decors/kfx921-1-main.webp","detail":"assets/decors/kfx921-1-detail.webp"},{"sku":"1192-A86","name":"1192-A86","price":13900,"main":"assets/decors/1192-a86-main.webp","detail":"assets/decors/1192-a86-detail.webp"},{"sku":"745-A236","name":"745-A236","price":13900,"main":"assets/decors/745-a236-main.webp","detail":"assets/decors/745-a236-detail.webp"},{"sku":"JS001-A235","name":"JS001-A235","price":13900,"main":"assets/decors/js001-a235-main.webp","detail":"assets/decors/js001-a235-detail.webp"},{"sku":"P5-JX1007J","name":"P5 (JX1007J)","price":13900,"main":"assets/decors/p5-jx1007j-main.webp","detail":"assets/decors/p5-jx1007j-detail.webp"}];
const grid=document.getElementById('grid'), search=document.getElementById('search'), sort=document.getElementById('sort'),modal=document.getElementById('modal');
function money(n){return n.toLocaleString('ru-RU')+' ₽ / панель'}
function render(){let arr=decors.filter(x=>x.name.toLowerCase().includes(search.value.toLowerCase())||x.sku.toLowerCase().includes(search.value.toLowerCase()));
if(sort.value==='price')arr.sort((a,b)=>a.price-b.price);if(sort.value==='name')arr.sort((a,b)=>a.name.localeCompare(b.name,'ru'));
document.getElementById('count').textContent=arr.length+' из '+decors.length;
grid.innerHTML=arr.map(x=>`<article class="card" tabindex="0" role="button" data-sku="${x.sku}" aria-label="Посмотреть ${x.name}"><div class="cover"><img src="${x.main}" alt="Декор ${x.name}" loading="lazy" decoding="async"></div><div class="info"><div class="eyebrow">NimTech Bamboo</div><div class="sku">${x.name}</div><div class="price">${money(x.price)}</div><div class="hint">Два ракурса · подробнее</div></div></article>`).join('');
grid.querySelectorAll('.card').forEach(el=>{let open=()=>show(el.dataset.sku);el.addEventListener('click',open);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}})})}
function show(sku){let x=decors.find(z=>z.sku===sku);document.getElementById('modal-title').textContent=x.name;document.getElementById('gallery').innerHTML=[x.main,x.detail].map((src,i)=>`<img src="${src}" alt="${x.name}: ${i?'крупный план':'общий вид'}">`).join('');document.getElementById('modal-price').textContent=money(x.price);modal.showModal()}
document.getElementById('close').onclick=()=>modal.close();modal.onclick=e=>{if(e.target===modal)modal.close()};
search.oninput=render;sort.onchange=render;render();
</script><!-- Yandex.Metrika counter -->
